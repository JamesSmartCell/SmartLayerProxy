; SmartLayerProxy TypeScript - copy from Java project or customize
; For https: server port 8433, iot.port 8004
; For http: server port 8080, iot.port 8003

server.port=8081
udp.port=8083
tcp.port=8082

; Telemetry configuration
telemetry.db.path=./data/telemetry.db
telemetry.retention.days=30
; telemetry.api.key=your-secret-key-here

; Admin addresses (comma-separated, for firmware & telemetry ack)
; admin.addresses=0x1234...,0x5678...
; telemetry.admin.addresses=0x9abc...

; Telemetry feed settings
telemetry.feed.max.limit=5000
telemetry.ack.enabled=false

; Firmware upload settings
firmware.upload.max.size.mb=10
