name: Deploy proxy
on:
  push:
    branches: [master]
  workflow_dispatch:
concurrency: deploy-proxy
jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: [self-hosted, smartlayer]
    steps:
      - name: Pull, build, restart
        working-directory: /home/pi/dev/SmartLayerProxy
        run: |
          git pull --ff-only
          npm ci
          npm run build
          sudo systemctl restart scriptproxy
      - name: Health check
        run: sleep 3 && systemctl is-active scriptproxy
